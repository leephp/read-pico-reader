<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>折角 · Pico 阅读器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6e6e2;color:#191919;font:16px/1.45 "PingFang SC","Microsoft YaHei",sans-serif}button{color:inherit;font:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}button:focus-visible{outline:2px dashed;outline-offset:-3px}main{position:relative;width:min(100vw,380px);height:min(100dvh,675.55px);margin:auto;background:white;display:flex;flex-direction:column;padding:0 24px;overflow:hidden}body{min-height:100dvh;display:grid;place-items:center}header,footer,.line,.pager{display:flex;align-items:center;justify-content:space-between;gap:8px}header{height:48px;flex:none;border-bottom:1px solid;font:13px monospace;letter-spacing:1px}header button{padding:8px 0}article{min-height:0;overflow:auto;flex:1;scrollbar-width:thin;padding-bottom:12px}footer{border-top:1px solid;min-height:51px;flex:none}footer button{flex:1;text-align:center;font-size:14px;height:50px}footer .on{font-weight:bold;box-shadow:inset 0 3px}h1,h2,h3,p{margin:0}.serif,h2,.quote,.prose,.titlepage{font-family:"Songti SC","STSong",serif}h1{font-size:45px;letter-spacing:-3px;line-height:1.2;margin:32px 0 20px}h2{font-size:31px;letter-spacing:1px}small,.meta{font-size:13px}.mono{font-family:monospace;font-variant-numeric:tabular-nums}.ribbon{display:block;width:19px;height:47px;background:#181818;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);margin-left:auto}.home h2{margin:24px 0 5px}.quote{font-size:31px;line-height:1.75;letter-spacing:1px;margin:32px 0 25px}.rule,.row,.primary{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}.rule{border-block:1px solid;padding:13px 0}.row{border-bottom:1px solid #aaa;padding:17px 0}.row b,.row small{display:block}.row small{margin-top:4px}.primary{background:#171717;color:white;padding:14px;margin-top:15px}.shelf h1{font-size:65px;margin:30px 0 20px}.book{display:grid;grid-template-columns:40px 1fr auto;text-align:left;width:100%;align-items:center;gap:9px;padding:18px 6px;border-bottom:2px solid}.book.active{background:#191919;color:white}.book strong{font-size:19px}.book small{display:block;margin-top:4px}.number{font:28px monospace}.group{font-size:13px;margin:23px 0 0;border-bottom:2px solid;padding-bottom:6px}.prose{font-size:var(--size);line-height:var(--leading);text-align:justify}.prose p{margin:0 0 .65em;text-indent:2em}.chapter{margin:28px 0 20px}.chapter small{display:block;font:13px monospace;margin-bottom:6px}.pager{width:100%;font-size:13px}.pager button{padding:12px 0}.sheet{position:absolute;bottom:0;left:0;width:100%;padding:16px 24px 22px;background:white;border-top:3px double;z-index:2}.sheet .row{padding:13px 0}.sheet h2{font-size:24px}.readerpage{cursor:pointer}.label{display:inline-block;border:1px solid;font:12px monospace;padding:3px 6px}.intro{margin:18px 0;line-height:1.8}.options{display:flex;gap:5px;margin:10px 0 20px}.options button{flex:1;border:1px solid;padding:9px 0;text-align:center}.chosen{background:#191919;color:white}.lock{margin:auto;text-align:center}.lock h1{font:64px "Songti SC",serif;writing-mode:vertical-rl;letter-spacing:8px;margin:25px auto}.lock .ribbon{margin:0 auto}.progress{height:3px;background:#ddd;margin-top:12px}.progress i{display:block;height:100%;background:#222}.sub{padding-top:12px}.bookmark{font-size:13px}.fileicon{font:13px monospace;border:1px solid;padding:4px;min-width:42px;text-align:center}.filetitle{flex:1}.titlepage{font-size:24px}.end{font-size:13px;text-align:center;margin:20px}.off{visibility:hidden}button:disabled{color:#888;cursor:default}@media(max-height:570px){.quote{font-size:24px;margin:15px 0}}
</style>
<main id="device" aria-label="折角阅读器"></main>
<script>
const books=[
 {name:'河岸手记',type:'EPUB',chs:['渡口','芦苇荡','归舟'],pages:[
 ['天刚亮，渡口还没有人。系船的绳子浸在水里，随着水面一起一落。','我在石阶上坐了一会儿。河对岸传来开门的声音，接着是一把扫帚轻轻擦过青石板。'],
 ['那只渡船从雾里出来的时候，看上去比昨日小了一些。','船夫松开绳结，把竹篙递给我。篙尖碰到水底，才知道这一带的河水很浅。'],
 ['风是从芦苇里钻出来的，先碰到人的袖口，然后才听见响声。','沿岸的小路窄得只够一个人走。我把手伸进草叶之间，露水很快就打湿了手腕。'],
 ['归来的船泊在柳树下。新换的缆绳，还留着草木的气味。','天色将晚，岸上亮起一盏灯。']]},
 {name:'巷陌拾遗',type:'TXT',chs:['石阶','南窗'],pages:[['沿着旧巷走进去，石阶上还留着昨夜的雨。','卖花的人推开木窗，把一盆茉莉放在第一层台阶上。'],['窗棂的一半落在阴影里。','有人把一张旧报纸叠了两折，垫在花盆下面。']]},
 {name:'雨中来信',type:'EPUB',chs:['来信','回音'],pages:[['信是一个下雨的下午送来的。','信封上只有我的名字。打开时，一张车票先落在了桌面上。'],['雨停的时候，我写下第一行回信。','窗外的屋檐仍在滴水，每一滴都隔得很远。']]}];
const starts=[[0,2,3],[0,1],[0,1]],names={home:'首页',shelf:'书架',files:'文件',settings:'设置'},params=new URLSearchParams(location.search);
let state={id:0,pos:[0,0,0],recent:[0,1,2],marks:[],size:21,leading:1.85,refresh:10};
const demo=params.has('shot');try{if(!demo)Object.assign(state,JSON.parse(localStorage.getItem('folded-reader-v1')||'{}'))}catch{}
let view=params.get('view')||'home',panel=params.get('panel')||'',folder=false,origin='shelf',returnTo='settings',chapterTab='目录',transfer='USB';
const root=document.querySelector('main'),b=()=>books[state.id],page=()=>state.pos[state.id],ch=(i,n)=>starts[i].filter(v=>v<=n).length-1;
function save(){try{if(!demo)localStorage.setItem('folded-reader-v1',JSON.stringify(state))}catch{}}
function go(v){view=v;panel='';draw()}
function book(i,from){origin=from;state.id=i;state.recent=[i,...state.recent.filter(v=>v!==i)];save();go('reader')}
function pos(n){state.pos[state.id]=n;save();go('reader')}
function set(k,v){state[k]=v;save();draw()}
function toggle(){let key=state.id+'-'+page();state.marks=state.marks.includes(key)?state.marks.filter(x=>x!==key):[...state.marks,key];save();draw()}
function options(k,items){return '<div class="options">'+items.map(([v,t])=>'<button class="'+(state[k]===v?'chosen':'')+'" onclick="set(\''+k+'\','+v+')">'+t+'</button>').join('')+'</div>'}
const btn=(s,action,cl='')=>'<button class="'+cl+'" onclick="'+action+'">'+s+'</button>';
const row=(s,end,act)=>btn('<b>'+s+'</b><span>'+end+'</span>',act,'row');
const route=v=>"go('"+v+"')";
function draw(){
 const i=state.id,n=page(),bk=b(),ci=ch(i,n),c=bk.chs[ci],key=i+'-'+n,marked=state.marks.includes(key),meta='卷一　／　'+c;
 const nav=Object.entries(names).map(([k,v])=>btn(v,route(k),view===k?'on':'')).join('');
 let title='折 角',body='',bottom=nav,overlay='',back='';
 if(view==='home'){body='<section class="home"><i class="ribbon"></i><h2>'+bk.name+'</h2><small>'+meta+'</small><p class="quote">'+bk.pages[n][0]+'</p>'+btn('从这里接着读 <span>›</span>',"book("+i+",'home')",'rule')+'</section>'}
 if(view==='shelf'){title='册 序';body='<section class="shelf"><h1>书目</h1><div class="line meta"><span>按最近阅读排序</span><span>共 03 册</span></div>'+state.recent.map((j,k)=>btn('<span class="number">0'+(k+1)+'</span><span><strong>'+books[j].name+'</strong><small>'+books[j].chs[ch(j,state.pos[j])]+'　／　'+books[j].type+'</small></span><span>›</span>',"book("+j+",'shelf')",'book '+(k===0?'active':''))).join('')+'</section>'}
 if(view==='files'){title='文 件';body='<h1>文件</h1><div class="group">TF 卡'+(folder?'　/　Books':'　/ 根目录')+'</div>'+(folder?btn('‹ 上级目录','folder=false;draw()','row')+books.map((x,j)=>btn('<span class="fileicon">'+x.type+'</span><span class="filetitle">'+x.name+'.'+x.type.toLowerCase()+'</span>›',"book("+j+",'files')",'row')).join(''):row('Books','3 个文件　›','folder=true;draw()'))+row('文件传输','›',route('transfer'))}
 if(view==='settings'){title='设 置';body='<h1>设置</h1><div class="group">阅读与显示</div>'+row('阅读排版',state.size+'　›',"returnTo='settings';go('type')")+row('自动全刷',state.refresh+' 页　›',route('refresh'))+'<div class="group">设备</div>'+row('文件传输','›',route('transfer'))+row('锁屏预览','›',route('lock'))}
 if(view==='reader'){title=bk.name;back=route(origin);body='<section class="readerpage" onclick="panel=\'tools\';draw()"><div class="chapter"><small>卷一　／　第 '+(ci+1)+' 章</small><h2>'+c+'</h2></div><div class="prose">'+bk.pages[n].map(s=>'<p>'+s+'</p>').join('')+'</div></section>';bottom='<div class="pager">'+(n?btn('‹ 上一页','pos('+(n-1)+')'):'<span>卷首</span>')+btn((n+1)+' / '+bk.pages.length+'　工具',"panel='tools';draw()")+(n<bk.pages.length-1?btn('下一页 ›','pos('+(n+1)+')'):'<span>全书完</span>')+'</div>';if(panel==='tools')overlay='<aside class="sheet"><div class="line"><h2>阅读工具</h2>'+btn('收起 ×',"panel='';draw()")+'</div>'+row('目录与书签','›',"chapterTab='目录';go('contents')")+row(marked?'移除本页书签':'加入本页书签',marked?'已收藏':'＋','toggle()')+row('阅读排版',state.size+'　›',"returnTo='reader';go('type')")+'</aside>'}
 if(view==='contents'){title=bk.name;back=route('reader');let marks=state.marks.filter(x=>x.startsWith(i+'-')).map(x=>Number(x.split('-')[1])).sort((a,b)=>a-b);body='<h1>'+chapterTab+'</h1><div class="options">'+['目录','书签'].map(t=>btn(t,"chapterTab='"+t+"';draw()",chapterTab===t?'chosen':'')).join('')+'</div>'+(chapterTab==='目录'?bk.chs.map((s,j)=>row(s,j===ci?'正在读':'第 '+(starts[i][j]+1)+' 页','pos('+starts[i][j]+')')).join(''):marks.map(x=>row(bk.chs[ch(i,x)],'第 '+(x+1)+' 页','pos('+x+')')).join('')||'<p class="intro">还没有书签。阅读时打开工具，即可收藏当前页。</p>');bottom=btn('‹ 返回正文',back)}
 if(view==='type'){title='阅读排版';back=route(returnTo);body='<h1>阅读排版</h1><div class="group">字号</div>'+options('size',[[18,'小'],[21,'标准'],[24,'大']])+'<div class="group">行距</div>'+options('leading',[[1.55,'紧凑'],[1.85,'舒展'],[2.1,'宽松']])+'<div class="group">正文预览</div><div class="prose sub"><p>'+bk.pages[n][0]+'</p></div>';bottom=btn('‹ 返回'+(returnTo==='reader'?'正文':'设置'),back)}
 if(view==='refresh'){title='显示';back=route('settings');body='<h1>自动全刷</h1><p class="intro">设置间隔页数，定期清理墨水屏残影。</p>'+options('refresh',[[5,'5 页'],[10,'10 页'],[15,'15 页'],[30,'30 页']]);bottom=btn('‹ 返回设置',back)}
 if(view==='transfer'){title='文件传输';back=route(originTransfer);body='<h1>传书</h1><div class="options">'+['USB','Wi-Fi','设备热点'].map(t=>btn(t,"transfer='"+t+"';draw()",transfer===t?'chosen':'')).join('')+'</div><div class="group">'+transfer+' 传输</div><p class="intro">'+({'USB':'使用数据线连接电脑，将 EPUB 或 TXT 文件复制到 TF 卡的 Books 目录。','Wi-Fi':'阅读器与电脑连接同一个无线网络，再通过设备显示的地址传书。','设备热点':'用电脑连接阅读器创建的热点，再打开设备显示的传输页面。'})[transfer]+'</p><small>界面演示 · 未连接设备</small>';bottom=btn('‹ 返回',back)}
 if(view==='lock'){title='休 眠';body='<div class="lock"><i class="ribbon"></i><h1>折角</h1><h2>'+bk.name+'</h2><small>'+meta+'</small></div>';bottom=btn('唤醒阅读器',route('home'))}
 root.style.setProperty('--size',state.size+'px');root.style.setProperty('--leading',state.leading);
 root.innerHTML='<header>'+(back?btn('‹　'+title,back):'<span>'+title+'</span>')+'<span>08:42　▰ 82%</span></header><article>'+body+'</article><footer>'+bottom+'</footer>'+overlay
}
let originTransfer='settings';root.addEventListener('click',()=>{if(view==='settings'||view==='files')originTransfer=view},true);
let touchY=0;root.addEventListener('touchstart',e=>touchY=e.touches[0].clientY,{passive:true});root.addEventListener('touchend',e=>{if(view==='reader'&&!panel&&touchY>root.getBoundingClientRect().bottom-85&&touchY-e.changedTouches[0].clientY>30){panel='tools';draw()}},{passive:true});
draw();
</script></html>
