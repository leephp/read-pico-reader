<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#e2e2df;color:#181818;font:16px 'PingFang SC',sans-serif}main{width:min(100%,342px);height:608px;background:white;padding:20px 21px;margin:auto;position:relative;overflow:auto}header,footer,.line{display:flex;justify-content:space-between;align-items:center}header{font:12px monospace;letter-spacing:1px;border-bottom:1px solid;padding-bottom:10px}footer{position:absolute;bottom:17px;left:21px;right:21px;border-top:1px solid;padding-top:10px;font-size:12px}button{font:inherit;color:inherit;background:transparent;cursor:pointer;border:0;padding:0;text-align:left}button:focus-visible{outline:2px dashed;outline-offset:2px}h1,h2,p{margin:0}h1,.serif,.reading p{font-family:'Songti SC','STSong',serif}h1{font-size:38px;margin:16px 0}small{font-size:12px}.action{background:#191919;color:white;width:100%;padding:12px 14px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #999;width:100%;padding:11px 0}.poster{display:block;position:relative;border:1px solid;width:100%;height:227px;padding:19px;background:#fafafa;overflow:hidden}.poster strong{font: bold 55px 'Songti SC',serif;writing-mode:vertical-rl;position:relative;z-index:1}.poster small{writing-mode:vertical-rl;position:absolute;left:90px;top:25px}.waves{position:absolute;right:-74px;bottom:-55px;width:250px;height:250px;border-radius:50%;background:repeating-radial-gradient(circle,#222 0 1px,transparent 2px 8px)}.shelf h1{font: bold 64px 'PingFang SC',sans-serif;letter-spacing:-6px;margin:40px 0 20px}.shelf .row{display:grid;grid-template-columns:42px 1fr auto;gap:8px;padding:20px 4px;border-bottom:2px solid}.num{font:25px monospace}.shelf .row:first-of-type{background:#191919;color:white}.shelf .row small{display:block;margin-top:4px}.leaf h1{font-size:26px;margin:40px 0 8px}.quote{font: 30px/1.7 'Songti SC',serif;letter-spacing:2px;margin:30px 0 15px}.leaf .action{background:white;color:#111;border-block:1px solid}.reading h1{font-size:29px;margin:42px 0 22px}.reading p{font-size:20px;line-height:1.85;text-indent:2em}.reading footer button{padding:8px}.index h1{margin:32px 0}.mark{width:18px;height:40px;background:#191919;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);margin-left:auto}.board{display:flex;gap:18px;justify-content:center}.board main{margin:0}@media(min-width:450px){body:not(.board){padding:22px}}</style><title>册序</title><body><main><header>册 序<span>08:42　▰ 82%</span></header><div class="shelf"><h1>书目</h1><div class="line"><small>按最近阅读排序</small><small>共 03 册</small></div><button class="row" onclick="read(0)"><span class="num">01</span><span><b>河岸手记</b><small>渡口　／　上次读到</small></span><span>›</span></button><button class="row" onclick="read(1)"><span class="num">02</span><span><b>巷陌拾遗</b><small>石阶　／　待翻阅</small></span><span>›</span></button><button class="row" onclick="read(2)"><span class="num">03</span><span><b>雨中来信</b><small>来信　／　待翻阅</small></span><span>›</span></button></div><footer><span>首页</span><button onclick="index()">我的书架 ›</button></footer></main><script>const names=["河岸手记", "巷陌拾遗", "雨中来信"],chap=["渡口", "石阶", "来信"],para=[["天刚亮，渡口还没有人。系船的绳子浸在水里，随着水面一起一落。", "我在石阶上坐了一会儿。河对岸传来开门的声音，接着是一把扫帚轻轻擦过青石板。"], ["沿着旧巷走进去，石阶上还留着昨夜的雨。", "卖花的人推开木窗，把一盆茉莉放在第一层台阶上。"], ["信是一个下雨的下午送来的。", "信封上只有我的名字。打开时，一张车票先落在了桌面上。"]],root=document.querySelector('main'),home=root.innerHTML;let book=0,pg=0;function back(){root.innerHTML=home}function foot(a,b){return '<footer>'+a+b+'</footer>'}function index(){root.innerHTML='<header>藏书索引 <span>03 册</span></header><h1>我的书架</h1>'+names.map((n,i)=>'<button class="row" onclick="read('+i+')">'+n+'<small>打开</small></button>').join('')+foot('<button onclick="back()">返回首页</button>','')}function read(i,n=0){book=i;pg=n;root.innerHTML='<div class="reading"><header>'+names[i]+'<span>阅读</span></header><h1>'+chap[i]+'</h1><p>'+para[i][n]+'</p>'+foot('<button onclick="back()">首页</button><span>'+(n+1)+' / 2</span>',n?'<button onclick="read(book,0)">上一页</button>':'<button onclick="read(book,1)">下一页</button>')+'</div>'}</script></body></html>
