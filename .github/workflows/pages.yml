name: Publish web flasher

on:
  workflow_call:
    inputs:
      build_run_id:
        type: string
        required: true
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Metalio 使用受保护的 main 发布站点；其独立标签只归档固件。 / Deploy Metalio metadata from protected main; its tag archives binaries only.
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'metalio-s31-')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual/release deployments also publish the current main site.
          ref: ${{ inputs.build_run_id && github.sha || 'main' }}
      - name: Select the successful Pico build for this revision
        id: firmware
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          sha=$(git rev-parse HEAD)
          run_id="$BUILD_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
              -f branch=main -f head_sha="$sha" -f status=success \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].id // empty')
          fi
          test -n "$run_id" || { echo "::error::Run build on main successfully before deploying this revision"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: firmware-pico
          path: ${{ runner.temp }}/web-firmware
          github-token: ${{ github.token }}
          run-id: ${{ steps.firmware.outputs.run_id }}
      - name: Build browser simulator from the checked-out Pico source
        shell: bash
        run: |
          sdk="$RUNNER_TEMP/emsdk"
          git clone --quiet --depth 1 --branch 6.0.13 https://github.com/emscripten-core/emsdk.git "$sdk"
          test "$(git -C "$sdk" rev-parse HEAD)" = 35659964bc2762fffec0d257997fb61475f765b7
          "$sdk/emsdk" install 6.0.13
          "$sdk/emsdk" activate 6.0.13
          source "$sdk/emsdk_env.sh"
          python3 tools/simulator/web/build.py
      - name: Validate and stage public flashing files
        run: |
          python3 tools/stage_public_flash.py _site --web-package "$RUNNER_TEMP/web-firmware/pico" \
            --simulator tools/simulator/web/dist --source-commit "$(git rev-parse HEAD)" --build-date "$(git show -s --format=%cI HEAD)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Check that main still points to this revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$(git rev-parse HEAD)" = "$head" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; fi
      - id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
